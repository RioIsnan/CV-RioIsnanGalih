name: Deploy Website to cPanel

on:
  push:
    branches:
      - main # Sesuaikan jika nama branch utama kamu 'master'

jobs:
  web-deploy:
    name: Deploying Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Files via FTP
        uses: SamKirland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/rioisnangalih.my.id # Sesuaikan jika folder di cPanel berbeda
